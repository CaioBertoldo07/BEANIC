<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#05111f"/>
      <stop offset="1" stop-color="#0a1422"/>
    </linearGradient>
    <radialGradient id="glow1" cx="180" cy="540" r="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="1050" cy="80" r="450" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a8e065" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#a8e065" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" stroke="rgba(255,255,255,0.025)" fill="none"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.55"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Eyebrow -->
  <g transform="translate(80, 90)">
    <rect x="0" y="-2" width="8" height="20" rx="1" fill="#2dd4bf"/>
    <text x="22" y="14" fill="#2dd4bf" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" font-size="20" font-weight="500" letter-spacing="3" text-rendering="geometricPrecision">
      BEANIC · TECNOLOGIA SOB MEDIDA
    </text>
  </g>

  <!-- Headline -->
  <g transform="translate(80, 230)">
    <text x="0" y="0" fill="#e8eef6" font-family="Inter, ui-sans-serif, -apple-system, system-ui, sans-serif" font-size="96" font-weight="700" letter-spacing="-3" text-rendering="geometricPrecision">
      Pare de <tspan fill="#2dd4bf">improvisar</tspan>.
    </text>
    <text x="0" y="120" fill="#e8eef6" font-family="Inter, ui-sans-serif, -apple-system, system-ui, sans-serif" font-size="96" font-weight="700" letter-spacing="-3" text-rendering="geometricPrecision">
      Comece a <tspan fill="#a8e065">escalar</tspan>.
    </text>
  </g>

  <!-- Sub -->
  <g transform="translate(80, 440)">
    <text x="0" y="0" fill="#9aa9bc" font-family="Inter, ui-sans-serif, -apple-system, system-ui, sans-serif" font-size="28" font-weight="400" text-rendering="geometricPrecision">
      Sistemas, sites e automações sob medida pra empresas
    </text>
    <text x="0" y="40" fill="#9aa9bc" font-family="Inter, ui-sans-serif, -apple-system, system-ui, sans-serif" font-size="28" font-weight="400" text-rendering="geometricPrecision">
      que cresceram sem estrutura.
    </text>
  </g>

  <!-- URL bottom right -->
  <g transform="translate(1120, 570)">
    <text x="0" y="0" fill="#9aa9bc" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" font-size="22" font-weight="500" letter-spacing="2" text-anchor="end" text-rendering="geometricPrecision">
      beanic.com.br
    </text>
  </g>

  <!-- Bottom left: small badge -->
  <g transform="translate(80, 560)">
    <rect x="0" y="-20" width="220" height="30" rx="15" fill="rgba(45,212,191,0.10)" stroke="rgba(45,212,191,0.40)" stroke-width="1"/>
    <circle cx="18" cy="-5" r="3.5" fill="#2dd4bf"/>
    <text x="32" y="0" fill="#2dd4bf" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" font-size="13" font-weight="500" letter-spacing="1.5">
      ERP entregue · 2026
    </text>
  </g>
</svg>
